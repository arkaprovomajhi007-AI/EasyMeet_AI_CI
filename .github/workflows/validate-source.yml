name: EasyMeet source validation

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which private source PR should be validated"
        required: true
        default: both
        type: choice
        options:
          - phase1
          - phase3
          - both
  push:
    branches:
      - main
    paths:
      - ".github/workflows/validate-source.yml"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: easymeet-ci-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ github.event_name == 'workflow_dispatch' && inputs.target != 'both' && fromJSON(format('["{0}"]', inputs.target)) || fromJSON('["phase1","phase3"]') }}
    steps:
      - name: Resolve source PR ref
        id: source
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            phase1)
              echo "ref=refs/pull/36/merge" >> "$GITHUB_OUTPUT"
              echo "label=Phase 1 security remediation PR #36" >> "$GITHUB_OUTPUT"
              ;;
            phase3)
              echo "ref=refs/pull/35/merge" >> "$GITHUB_OUTPUT"
              echo "label=Phase 3 provider integration PR #35" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unsupported target"
              exit 1
              ;;
          esac

      - name: Checkout private source (read-only token)
        uses: actions/checkout@v4
        with:
          repository: arkaprovomajhi007-AI/EasyMeet_AI
          ref: ${{ steps.source.outputs.ref }}
          token: ${{ secrets.SOURCE_REPO_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify source ref
        working-directory: source
        run: |
          echo "Validating ${{ steps.source.outputs.label }}"
          git log -1 --oneline
          test -f package.json
          test -f bun.lock || test -f bun.lockb

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: source
        run: bun install --frozen-lockfile

      - name: Frontend type-check
        working-directory: source
        run: bun run lint

      - name: Frontend build
        working-directory: source
        run: bun run build

      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/server/package.json

      - name: Install server dependencies
        working-directory: source/server
        run: npm ci --no-audit --no-fund

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Server unit and Firestore rules tests
        working-directory: source/server
        run: firebase emulators:exec --only firestore --project demo-easymeet-firestore-rules --config ../firebase.emulator.json "npm test"

      - name: Server type-check
        working-directory: source/server
        run: npm run typecheck

      - name: Server build
        working-directory: source/server
        run: npm run build

  generate-server-lock:
    name: Generate server npm lockfile
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[generate-server-lock]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private Phase 1 source (read-only token)
        uses: actions/checkout@v4
        with:
          repository: arkaprovomajhi007-AI/EasyMeet_AI
          ref: refs/pull/36/merge
          token: ${{ secrets.SOURCE_REPO_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate reproducible server lockfile
        working-directory: source/server
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Emit lockfile transfer payload
        working-directory: source/server
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          payload = base64.b64encode(Path("package-lock.json").read_bytes()).decode("ascii")
          print("EASYMEET_PACKAGE_LOCK_B64_BEGIN")
          for offset in range(0, len(payload), 6000):
              print("EASYMEET_PACKAGE_LOCK_B64_CHUNK:" + payload[offset:offset + 6000])
          print("EASYMEET_PACKAGE_LOCK_B64_END")
          print(f"Generated package-lock.json: {Path('package-lock.json').stat().st_size} bytes")
          PY

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: easymeet-server-package-lock
          path: source/server/package-lock.json
          if-no-files-found: error
          retention-days: 2
